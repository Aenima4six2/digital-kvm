[package]
name = "digital-kvm"
version = "0.1.0"
edition = "2024"
description = "Event-driven USB switch to monitor input bridge for Windows, macOS, and Linux"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
